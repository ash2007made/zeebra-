
<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zeebra的心理テスト</title>

  <style>
    /* 基本設定 */
    * {
      box-sizing: border-box;
    }

    :root {
      --background: #101010;
      --card: #1d1d1d;
      --text: #f5f5f5;
      --accent: #8A5AC4;
      --border: #444444;
    }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      background: var(--background);
      color: var(--text);

      font-family:
        Arial,
        "Hiragino Kaku Gothic ProN",
        "Yu Gothic",
        Meiryo,
        sans-serif;

      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
    }

    .container {
      width: 100%;
      max-width: 520px;
      text-align: center;
    }

    /* タイトル */
    .subtitle {
      font-size: 27px;
      font-weight: 500;
      margin: 0 0 35px;
    }

    /* カード */
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 40px 25px;
    }

    .question {
      font-size: clamp(20px, 5vw, 27px);
      line-height: 1.7;
      margin: 0 0 35px;
      font-weight: 500;
    }

    /* 選択肢 */
    .choices {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    button {
      font-family: inherit;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .choice-btn {
      width: 100%;
      min-height: 75px;
      padding: 18px 16px;

      background: transparent;
      color: var(--text);

      border: 1.5px solid #666666;
      border-radius: 14px;

      font-size: 16px;
      line-height: 1.6;

      transition:
        background 0.2s ease,
        border-color 0.2s ease,
        transform 0.2s ease;
    }

    @media (hover: hover) {
      .choice-btn:hover {
        background: #30263b;
        border-color: var(--accent);
        transform: translateY(-2px);
      }
    }

    .choice-btn:active {
      background: var(--accent);
      border-color: var(--accent);
      transform: scale(0.98);
    }

    .choice-btn:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 4px;
    }

    /* 診断結果 */
    .result-type {
      font-size: clamp(28px, 7vw, 40px);
      font-weight: 600;
      color: var(--accent);
      line-height: 1.5;
      margin: 0 0 25px;
    }

    .result-description {
      font-size: 17px;
      font-weight: 400;
      line-height: 2;
      margin: 0;
      white-space: pre-line;
    }

    /* 結果画面の画像 */
    .gazou {
      margin-top: 30px;
      text-align: center;
    }

    .gazou img {
      display: block;
      width: 300px;
      max-width: 100%;
      height: auto;
      margin: 0 auto;
    }

    /* 非表示 */
    [hidden] {
      display: none !important;
    }

    /* アニメーション */
    .fade-in {
      animation: fadeIn 0.4s ease both;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(15px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
    }

    /* スマートフォン対応 */
    @media (max-width: 480px) {
      .card {
        padding: 35px 20px;
      }

      .subtitle {
        font-size: 24px;
      }

      .choice-btn {
        font-size: 15px;
        min-height: 72px;
      }

      .result-description {
        font-size: 16px;
      }

      .gazou img {
        width: 260px;
      }
    }
  </style>
</head>

<body>

  <main class="container">

    <h1 class="subtitle">Zeebra的心理テスト</h1>

    <!-- 質問画面 -->
    <section id="questionScreen" class="card fade-in">

      <h2 id="question" class="question"></h2>

      <div class="choices">

        <button
          id="choiceA"
          class="choice-btn"
          type="button">
        </button>

        <button
          id="choiceB"
          class="choice-btn"
          type="button">
        </button>

      </div>

    </section>

    <!-- 診断結果画面 -->
    <!-- このsection全体を最初は非表示にする -->
    <section id="resultScreen" class="card" hidden>

      <h2 id="resultType" class="result-type"></h2>

      <p
        id="resultDescription"
        class="result-description">
      </p>

      <!-- 結果画面だけに表示される画像 -->
      <div class="gazou">
        <img
          src="Zeebraサイト用.jpg"
          alt="診断結果画像">
      </div>

    </section>

  </main>

  <script>

    // =========================
    // 1. 質問データ
    // =========================

    const questions = [
      {
        question: "物事を始めるタイミングはいつ？",
        choices: [
          "できると思えるまで準備してから",
          "やりたいと思ったらすぐ"
        ]
      },
      {
        question: "新卒で働くならどっち？",
        choices: [
          "あの有名大企業",
          "就活せずに起業する"
        ]
      },
      {
        question: "部活の練習時間を増やしたいけど、最終下校時刻が早い。",
        choices: [
          "現在の条件の中で頑張る",
          "校則を変えるための策を練る"
        ]
      }
    ];

    // =========================
    // 2. 診断結果データ
    // =========================

    const results = {
      3: {
        name: "あきらめ先取りタイプ",
        description:
          "欲望を実現する以前に、「できない」と判断しがち。\n自分でも気づかないうちに諦めているかも。"
      },
      2: {
        name: "準備しすぎタイプ",
        description:
          "「できる」と思えるまで行動しないことが多い。\n努力家な反面、慎重すぎる一面も。"
      },
      1: {
        name: "様子見スタートタイプ",
        description:
          "行動に移せた場合でも、「本当にできるか」を心のそこで気にしがち。"
      },
      0: {
        name: "考える前に行動するタイプ",
        description:
          "「できるか」ではなく、「やりたいか」で行動するかを決めるタイプ。\nやりたいと思ったら、できるかどうかを考える前に動き出す。"
      }
    };

    // =========================
    // 3. ポイント設定
    // =========================

    // 前者を選んだら1ポイント
    const POINT_OPTION = 0;

    let currentQuestion = 0;
    let score = 0;

    // =========================
    // 4. HTML要素
    // =========================

    const questionScreen =
      document.getElementById("questionScreen");

    const resultScreen =
      document.getElementById("resultScreen");

    const questionElement =
      document.getElementById("question");

    const choiceA =
      document.getElementById("choiceA");

    const choiceB =
      document.getElementById("choiceB");

    // =========================
    // 5. 質問表示
    // =========================

    function showQuestion() {

      const data = questions[currentQuestion];

      questionElement.textContent = data.question;
      choiceA.textContent = data.choices[0];
      choiceB.textContent = data.choices[1];

      questionScreen.classList.remove("fade-in");
      void questionScreen.offsetWidth;
      questionScreen.classList.add("fade-in");
    }

    // =========================
    // 6. 回答処理
    // =========================

    function selectAnswer(choiceIndex) {

      if (choiceIndex === POINT_OPTION) {
        score++;
      }

      currentQuestion++;

      if (currentQuestion < questions.length) {
        showQuestion();
      } else {
        showResult();
      }
    }

    // =========================
    // 7. ボタン設定
    // =========================

    choiceA.addEventListener("click", function() {
      selectAnswer(0);
    });

    choiceB.addEventListener("click", function() {
      selectAnswer(1);
    });

    // =========================
    // 8. 診断結果表示
    // =========================

    function showResult() {

      // 質問画面を消す
      questionScreen.hidden = true;

      // 結果を取得
      const result = results[score];

      // 診断タイプと説明を表示
      document.getElementById("resultType").textContent =
        result.name;

      document.getElementById("resultDescription").textContent =
        result.description;

      // 結果カードと画像を一緒に表示
      resultScreen.hidden = false;

      // フェードイン
      resultScreen.classList.remove("fade-in");
      void resultScreen.offsetWidth;
      resultScreen.classList.add("fade-in");
    }

    // =========================
    // 9. 診断開始
    // =========================

    showQuestion();

  </script>

</body>
</html>
