
<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zeebra的心理テスト</title>

  <style>
    /* =========================
       基本設定
    ========================= */

    * {
      box-sizing: border-box;
    }

    :root {
      --background: #101010;
      --card: #1d1d1d;
      --text: #f5f5f5;
      --accent: #8A5AC4;
      --border: #444444;
    }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;

      background: var(--background);
      color: var(--text);

      /* シンプルなゴシック体 */
      font-family:
        Arial,
        "Hiragino Kaku Gothic ProN",
        "Yu Gothic",
        Meiryo,
        sans-serif;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 24px 16px;
    }

    .container {
      width: 100%;
      max-width: 520px;
      text-align: center;
    }

    /* =========================
       タイトル
    ========================= */

    .subtitle {
      font-size: 27px;
      font-weight: 500;
      margin: 0 0 35px;
      letter-spacing: 0;
    }

    /* =========================
       質問カード
    ========================= */

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 40px 25px;
    }

    .question {
      font-size: clamp(20px, 5vw, 27px);
      line-height: 1.7;
      margin: 0 0 35px;
      font-weight: 500;
    }

    /* =========================
       選択肢
    ========================= */

    .choices {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    button {
      font-family: inherit;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .choice-btn {
      width: 100%;
      min-height: 75px;
      padding: 18px 16px;

      background: transparent;
      color: var(--text);

      border: 1.5px solid #666666;
      border-radius: 14px;

      font-size: 16px;
      font-weight: 400;
      line-height: 1.6;

      transition:
        background 0.2s ease,
        border-color 0.2s ease,
        transform 0.2s ease;
    }

    @media (hover: hover) {
      .choice-btn:hover {
        background: #30263b;
        border-color: var(--accent);
        transform: translateY(-2px);
      }
    }

    .choice-btn:active {
      background: var(--accent);
      border-color: var(--accent);
      transform: scale(0.98);
    }

    .choice-btn:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 4px;
    }

    /* =========================
       診断結果
    ========================= */

    .result-type {
      font-size: clamp(28px, 7vw, 40px);
      font-weight: 600;
      color: var(--accent);
      line-height: 1.5;
      margin: 0 0 25px;
    }

    .result-description {
      font-size: 17px;
      font-weight: 400;
      line-height: 2;
      margin: 0;
    }

    /* =========================
       表示切り替え
    ========================= */

    [hidden] {
      display: none !important;
    }

    /* =========================
       アニメーション
    ========================= */

    .fade-in {
      animation: fadeIn 0.4s ease both;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(15px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
    }

    /* =========================
       スマートフォン対応
    ========================= */

    @media (max-width: 480px) {

      .card {
        padding: 35px 20px;
      }

      .subtitle {
        font-size: 24px;
      }

      .choice-btn {
        font-size: 15px;
        min-height: 72px;
      }

      .result-description {
        font-size: 16px;
      }
    }

  </style>
</head>

<body>

  <main class="container">

    <h1 class="subtitle">Zeebra的心理テスト</h1>

    <!-- 質問画面 -->
    <section id="questionScreen" class="card fade-in">

      <h2 id="question" class="question"></h2>

      <div class="choices">

        <button
          id="choiceA"
          class="choice-btn"
          type="button">
        </button>

        <button
          id="choiceB"
          class="choice-btn"
          type="button">
        </button>

      </div>

    </section>

    <!-- 診断結果画面 -->
    <section id="resultScreen" class="card" hidden>

      <h2 id="resultType" class="result-type"></h2>

      <p
        id="resultDescription"
        class="result-description">
      </p>

    </section>

  </main>


  <script>

    // =========================
    // 1. 質問データ
    // =========================

    const questions = [

      {
        question: "物事を始めるタイミングはいつ？",

        choices: [
          "できると思えるまで準備してから",
          "やりたいと思ったらすぐ"
        ]
      },

      {
        question: "プロサッカー選手を目指すならまず初めに何をする？",

        choices: [
          "地元のチームに入る",
          "海外の強豪クラブに行く"
        ]
      },

      {
        question: "髪を染めたいけど、学校の校則が厳しい",

        choices: [
          "仕方ないから黒髪",
          "校則を変える"
        ]
      }

    ];


    // =========================
    // 2. 診断結果データ
    // =========================

    const results = {

      3: {
        name: "Zeebra型",

        description:
          "欲望に忠実。できないを考えずに自分主役で野望に一直線。"
      },

      2: {
        name: "フューチャリング型",

        description:
          "波に乗れば一気に動けるタイプ。"
      },

      1: {
        name: "バックダンサー型",

        description:
          "気持ちはあるが、なかなか前に出きれないタイプ。"
      },

      0: {
        name: "オーディエンス型",

        description:
          "観客席で『自分には無理』と諦めてしまうタイプ。"
      }

    };


    // =========================
    // 3. ポイント設定
    // =========================

    // 0 = 前者を選んだら1ポイント
    // 1 = 後者を選んだら1ポイント

    const POINT_OPTION = 0;

    let currentQuestion = 0;
    let score = 0;


    // =========================
    // 4. HTML要素を取得
    // =========================

    const questionScreen =
      document.getElementById("questionScreen");

    const resultScreen =
      document.getElementById("resultScreen");

    const questionElement =
      document.getElementById("question");

    const choiceA =
      document.getElementById("choiceA");

    const choiceB =
      document.getElementById("choiceB");


    // =========================
    // 5. 質問を表示
    // =========================

    function showQuestion() {

      const data = questions[currentQuestion];

      questionElement.textContent = data.question;

      choiceA.textContent = data.choices[0];
      choiceB.textContent = data.choices[1];

      // フェードイン
      questionScreen.classList.remove("fade-in");

      void questionScreen.offsetWidth;

      questionScreen.classList.add("fade-in");

    }


    // =========================
    // 6. 回答を選んだとき
    // =========================

    function selectAnswer(choiceIndex) {

      // 指定した側を選んだら1点加算
      if (choiceIndex === POINT_OPTION) {
        score++;
      }

      // 次の質問へ
      currentQuestion++;

      if (currentQuestion < questions.length) {

        showQuestion();

      } else {

        // 3問終了したら結果表示
        showResult();

      }

    }


    // =========================
    // 7. ボタンのクリック処理
    // =========================

    choiceA.addEventListener("click", function() {
      selectAnswer(0);
    });

    choiceB.addEventListener("click", function() {
      selectAnswer(1);
    });


    // =========================
    // 8. 診断結果を表示
    // =========================

    function showResult() {

      // 質問画面を非表示
      questionScreen.hidden = true;

      // 結果画面を表示
      resultScreen.hidden = false;

      // 得点に対応した結果を取得
      const result = results[score];

      document.getElementById("resultType").textContent =
        result.name;

      document.getElementById("resultDescription").textContent =
        result.description;

      // 結果表示アニメーション
      resultScreen.classList.remove("fade-in");

      void resultScreen.offsetWidth;

      resultScreen.classList.add("fade-in");

    }


    // =========================
    // 9. 診断開始
    // =========================

    showQuestion();

  </script>

</body>
</html>
